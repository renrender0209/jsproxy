services:
  - type: web
    name: jsproxy
    env: static
    branch: gh-pages
    buildCommand: |
      cat > index.html << 'SWEOF'
      <!DOCTYPE html>
      <html>
      <head>
      <meta charset="utf-8">
      <title>jsproxy</title>
      </head>
      <body>
      <script>
      navigator.serviceWorker.register('sw.js')
        .then(function(reg) {
          if (navigator.serviceWorker.controller) {
            location.replace(location.href)
          } else {
            navigator.serviceWorker.addEventListener('controllerchange', function() {
              location.replace(location.href)
            })
          }
        })
        .catch(console.error)
      </script>
      </body>
      </html>
      SWEOF
    staticPublishPath: .
    headers:
      - path: /*
        name: Service-Worker-Allowed
        value: /
      - path: /*
        name: Cache-Control
        value: no-store
    routes:
      - type: rewrite
        source: /404
        destination: /404.html
      - type: rewrite
        source: /*
        destination: /index.html
